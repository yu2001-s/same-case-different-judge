<title>Same Case, Different Judge</title>
<meta name="description" content="How much do criminal judgments in Taiwan depend on the judge, the defendant and politics? Evidence from 3 million defendants, 2013–2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout concept: the report is set out like a Taiwanese judgment (主文 holding, 事實 facts, 理由 reasoning, 附錄 appendix),
   one reading column with charts allowed to run a little wider. */
:root {
  --bg: #f6f7f5;        /* page plane: cool paper */
  --surface: #fcfcfb;   /* chart / card surface */
  --ink: #15171a;
  --muted: #5d6066;
  --rule: #dfe1dc;
  --grid: #e6e7e2;
  --axis: #bfc1ba;
  --accent: #1c5cab;    /* court-document blue, shared with series 1 */
  --seal: #a8322a;      /* seal red, used once */
  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;
  --neutral-mark: #b9bbb4;
  --stack-legal: #2a78d6; --stack-pool: #86b6ef; --stack-judge: #eb6834; --stack-rest: #e3e4df;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  --measure: 68ch;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1011; --surface: #1a1a19; --ink: #f1f1ee; --muted: #a6a8a2; --rule: #2e2f2d; --grid: #2a2b29; --axis: #4a4b47;
    --accent: #6da7ec; --seal: #e07067; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral-mark: #5b5d58;
    --stack-legal: #3987e5; --stack-pool: #1c5cab; --stack-judge: #d95926; --stack-rest: #383835; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1011; --surface: #1a1a19; --ink: #f1f1ee; --muted: #a6a8a2; --rule: #2e2f2d; --grid: #2a2b29; --axis: #4a4b47;
  --accent: #6da7ec; --seal: #e07067; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral-mark: #5b5d58;
  --stack-legal: #3987e5; --stack-pool: #1c5cab; --stack-judge: #d95926; --stack-rest: #383835; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.7 var(--font-body); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; display: grid; gap: 56px; }
.col { max-width: var(--measure); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.stack { display: grid; gap: 16px; }
.stack-lg { display: grid; gap: 28px; }
.eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); display: flex; gap: 10px; align-items: baseline; }
.eyebrow .zh { letter-spacing: 0.3em; font-family: var(--font-display); font-size: 0.95rem; color: var(--ink); }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.meta { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.seal { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--seal); color: var(--seal);
  font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; line-height: 1; border-radius: 4px; transform: rotate(-4deg); }
header.top { display: grid; gap: 18px; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
.holding { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile .v { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.tile .l { font-size: 0.9rem; color: var(--muted); }
.findings { display: grid; gap: 12px; counter-reset: f; padding: 0; margin: 0; list-style: none; }
.findings li { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; }
.findings li::before { counter-increment: f; content: counter(f, cjk-ideographic); font-family: var(--font-display); color: var(--accent); font-weight: 700; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 12px; display: grid; gap: 10px; min-width: 0; }
figcaption { display: grid; gap: 4px; }
figcaption .t { font-weight: 700; font-size: 1rem; }
figcaption .s { font-size: 0.88rem; color: var(--muted); }
.chart { width: 100%; min-height: 120px; }
.chart.short { min-height: 0; }
.chart svg { display: block; overflow: visible; font: 12px var(--font-body); }
.chart .lab { font-size: 12.5px; }
.chart .small { font-size: 11.5px; }
.chart .num, .axis text { font-variant-numeric: tabular-nums; }
.hit { cursor: default; outline: none; }
.hit:hover, .hit:focus { filter: brightness(1.12); stroke-width: 3; }
details { font-size: 0.85rem; color: var(--muted); }
details summary { cursor: pointer; width: fit-content; }
details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 700; color: var(--ink); }
td { color: var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.note { font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--rule); padding-left: 12px; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.pill.held { color: var(--ink); border-color: var(--s3); }
.pill.fell { color: var(--ink); border-color: var(--s2); }
.pill.mixed { color: var(--ink); border-color: var(--neutral-mark); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ol.refs { overflow-wrap: anywhere; padding-left: 1.6em; display: grid; gap: 6px; font-size: 0.86rem; color: var(--muted); }
ol.refs li { padding-left: 4px; }
ol.refs .ver { font-size: 0.72rem; color: var(--muted); }
.phases { display: grid; gap: 14px; }
.phase { display: grid; grid-template-columns: 7.5em 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--rule); }
.phase .when { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
.rq { display: grid; gap: 10px; }
.rq > div { display: grid; grid-template-columns: 3.2em 1fr; gap: 10px; }
.rq b { color: var(--accent); }
sup.c { font-size: 0.7em; }
sup.c a { text-decoration: none; }
.viz-tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; max-width: 260px; }
.tip-row { display: flex; gap: 8px; align-items: baseline; }
.tip-row strong { font-variant-numeric: tabular-nums; }
.tip-row span { color: var(--muted); }
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; gap: 44px; }
  .phase { grid-template-columns: 1fr; gap: 4px; }
  .tile .v { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); padding: 2px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
.zh-s { font-size: 0.78rem; color: var(--muted); }
.muted { color: var(--muted); }
.module { display: grid; gap: 22px; }
.module > h2 .num { color: var(--accent); margin-right: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.controls label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.controls select, .controls input[type=search] { font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 8px; min-height: 36px; max-width: 100%; }
.controls .chk { display: flex; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--ink); min-height: 36px; }
.controls select:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.jt { max-height: 560px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.jt table { min-width: 640px; }
.jt th { position: sticky; top: 0; background: var(--surface); z-index: 1; cursor: pointer; white-space: nowrap; }
.jt td.bar { width: 34%; min-width: 180px; }
.jt .eff { position: relative; height: 16px; }
.jt .eff .axis0 { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.jt .eff .ci { position: absolute; top: 7px; height: 2px; background: var(--neutral-mark); border-radius: 2px; }
.jt .eff .pt { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--s1); border: 2px solid var(--surface); }
.jt tr.hi .eff .pt { background: var(--s2); }
.jt tr.lo .eff .pt { background: var(--s3); }
.badge { font-size: 0.72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.badge.hi { border-color: var(--s2); } .badge.lo { border-color: var(--s3); }
.count { font-size: 0.82rem; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpis .tile .v { font-size: 1.6rem; }
.wrap > *, .module > *, .stack-lg > *, .stack > *, .grid2 > * { min-width: 0; }
.jt td.court { white-space: nowrap; }
figure > * { min-width: 0; }
.controls label { min-width: 0; max-width: 100%; }
.controls select { width: 100%; text-overflow: ellipsis; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.88rem; }
</style>

<div class="wrap">
{{body_html}}
</div>
